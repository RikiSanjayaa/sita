name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    name: ci (PHP ${{ matrix.php-version }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    # PHP 8.4 matches production and gates merges; 8.5 is an early warning
    # for the next upgrade and does not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.4'
            experimental: false
          - php-version: '8.5'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        run: ./vendor/bin/pest

  e2e-shard:
    name: e2e (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Three runners share the suite (each with its own SQLite and servers);
    # every shard also runs the setup project it depends on.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # A real Reverb server is started by the Playwright config, and the build must compile the same keys.
    env:
      REVERB_APP_ID: local-app
      REVERB_APP_KEY: local-key
      REVERB_APP_SECRET: local-secret
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: '9011'
      REVERB_SCHEME: http
      REVERB_ALLOWED_ORIGINS: 127.0.0.1,localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, curl, dom, fileinfo, xml
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Locate Composer cache
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Build assets
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Cache Impeccable engine
        uses: actions/cache@v4
        with:
          path: ~/.impeccable/bin
          key: ${{ runner.os }}-impeccable-${{ hashFiles('.claude/skills/impeccable/scripts/VERSION') }}

      # The engine binary is not committed. The launcher downloads the version
      # pinned in scripts/VERSION (checksum verified) into ~/.impeccable/bin;
      # doing it here fails the job early if the download is blocked.
      - name: Install Impeccable engine
        run: .claude/skills/impeccable/scripts/impeccable engine-probe

      - name: Point Impeccable at Playwright Chromium
        run: echo "IMPECCABLE_BROWSER=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"

      - name: Record e2e start time
        run: echo "E2E_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run e2e
        id: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Write e2e duration
        if: always()
        run: |
          if [ -n "${E2E_START:-}" ]; then
            elapsed=$(($(date +%s) - E2E_START))
            printf 'Playwright e2e shard %s/3 duration: %s seconds\n' "${{ matrix.shard }}" "$elapsed" >> "$GITHUB_STEP_SUMMARY" || :
          fi

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Single status for the whole browser suite, so branch checks and tooling
  # keep looking for one "e2e" result.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-shard.result }}" = "success"
