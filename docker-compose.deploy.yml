# Run prebuilt images from GHCR instead of building on the server.
# Pin a release with APP_IMAGE / WEB_IMAGE, e.g. ghcr.io/rikisanjayaa/sita-app:sha-1a2b3c4.
x-app-image: &app-image
  image: ${APP_IMAGE:-ghcr.io/rikisanjayaa/sita-app:main}
  pull_policy: missing

services:
  init: *app-image
  app: *app-image
  queue: *app-image
  scheduler: *app-image
  reverb: *app-image
  web:
    image: ${WEB_IMAGE:-ghcr.io/rikisanjayaa/sita-web:main}
    pull_policy: missing
